<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Login · Recicla AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="login-page">
  <section class="login-hero">
    <div class="brand"><div class="brand-mark">♻</div><div class="brand-copy"><strong>Recicla AI</strong><small>Juntos por um futuro mais limpo.</small></div></div>
    <div class="login-hero-copy">
      <h1>Recicle hoje,<br><span>conquiste um<br>amanhã melhor.</span></h1>
      <p>Ganhe pontos reciclando, encontre ecopontos perto de você e troque por recompensas incríveis.</p>
    </div>
    <div class="login-art"><div class="planet">🌎</div><div class="float-leaf a">🌿</div><div class="float-leaf b">🍃</div><div class="float-leaf c">🌱</div></div>
  </section>
  <section class="login-side">
    <form class="login-card" id="loginForm">
      <a class="text-link login-back-link" href="index.html">← Voltar ao site</a>
      <h2>Bem-vindo de volta!</h2><p>Faça login para continuar</p>
      <label class="form-label">E-mail<div class="input-shell"><span>✉</span><input id="loginEmail" type="email" placeholder="seu@email.com" autocomplete="email" required></div></label>
      <label class="form-label">Senha<div class="input-shell"><span>⌑</span><input id="password" type="password" placeholder="Digite sua senha" required><button id="togglePassword" type="button" class="input-action">◉</button></div></label>
      <div class="login-options"><label class="checkbox"><input id="rememberMe" type="checkbox"> Lembrar de mim</label><button type="button" class="text-link" onclick="toast('Recuperação de senha ainda não disponível.')">Esqueceu sua senha?</button></div>
      <button class="primary full" type="submit">Entrar</button>
      <p class="login-register">Não tem uma conta? <a class="text-link" href="cadastro.html">Cadastre-se</a></p>
    </form>
  </section>
</div>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script></body></html>
