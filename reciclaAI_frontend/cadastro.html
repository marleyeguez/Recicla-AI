<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadastro · Recicla AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
  <section class="login-hero">
    <div class="brand"><div class="brand-mark">♻</div><div class="brand-copy"><strong>Recicla AI</strong><small>Juntos por um futuro mais limpo.</small></div></div>
    <div class="login-hero-copy">
      <h1>Comece hoje,<br><span>recicle e<br>acumule pontos.</span></h1>
      <p>Crie sua conta para acompanhar seus pontos, localizar ecopontos e participar do Recicla AI.</p>
    </div>
    <div class="login-art"><div class="planet">🌎</div><div class="float-leaf a">🌿</div><div class="float-leaf b">🍃</div><div class="float-leaf c">🌱</div></div>
  </section>

  <section class="login-side">
    <form class="login-card register-card" id="registerForm">
      <a class="text-link login-back-link" href="index.html">← Voltar ao site</a>
      <h2>Crie sua conta</h2>
      <p>Cadastre-se para começar</p>

      <label class="form-label">Nome
        <div class="input-shell"><span>♙</span><input id="registerName" type="text" placeholder="Seu nome" autocomplete="name" minlength="2" required></div>
      </label>

      <label class="form-label">E-mail
        <div class="input-shell"><span>✉</span><input id="registerEmail" type="email" placeholder="seu@email.com" autocomplete="email" required></div>
      </label>

      <label class="form-label">Senha
        <div class="input-shell"><span>⌑</span><input id="registerPassword" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required><button type="button" class="input-action" data-password-toggle="registerPassword">◉</button></div>
      </label>

      <label class="form-label">Confirmar senha
        <div class="input-shell"><span>⌑</span><input id="registerConfirmPassword" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" minlength="6" required><button type="button" class="input-action" data-password-toggle="registerConfirmPassword">◉</button></div>
      </label>

      <button id="registerSubmit" class="primary full register-submit" type="submit">Criar conta</button>
      <p class="login-register">Já possui uma conta? <a class="text-link" href="login.html">Entrar</a></p>
    </form>
  </section>
</div>
<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
